version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tet_fun_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_local:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"

volumes:
  mysql_local:
