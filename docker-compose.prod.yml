services:
  app:
    build: .
    container_name: tet-app
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 600M             # Max RAM cho app: 600MB
    mem_reservation: 300M       # Soft reservation (tùy chọn)
    memswap_limit: 600M         # Giới hạn swap = mem_limit → không swap ra disk
    cpus: 1.0                  # Giới hạn 1 CPU core (tùy chọn)

    volumes:
      - uploads:/uploads/images

  mysql:
    image: mysql:8.0
    container_name: mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: tet_fun_app
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: rootpassword
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --innodb_buffer_pool_size=256M
      --innodb_log_file_size=64M
    volumes:
      - mysql_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 800M
    mem_reservation: 400M
    memswap_limit: 800M
    cpus: 1.0

  redis:
    image: redis:7
    container_name: redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 300mb --maxmemory-policy allkeys-lru
    mem_limit: 400M
    mem_reservation: 100M
    memswap_limit: 400M
    cpus: 0.5

volumes:
  mysql_prod:
  uploads: